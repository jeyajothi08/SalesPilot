# ============================================================
# SalesPilot AI — Prometheus Alerting Rules
# Alerts for API errors, high latency, DB failures, queues
# ============================================================

groups:
  - name: api_alerts
    interval: 30s
    rules:
      # API down
      - alert: APIDown
        expr: up{job="salespilot-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "SalesPilot API is DOWN"
          description: "The FastAPI backend has been unreachable for more than 1 minute."

      # High error rate
      - alert: HighAPIErrorRate
        expr: |
          rate(http_requests_total{job="salespilot-api",status=~"5.."}[5m])
          / rate(http_requests_total{job="salespilot-api"}[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API error rate (>5%)"
          description: "{{ $value | humanizePercentage }} of API requests are returning 5xx errors."

      # High API latency
      - alert: HighAPILatency
        expr: |
          histogram_quantile(0.95,
            rate(http_request_duration_seconds_bucket{job="salespilot-api"}[5m])
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API P95 latency (>2s)"
          description: "P95 response time is {{ $value | humanizeDuration }}."

  - name: database_alerts
    rules:
      # PostgreSQL down
      - alert: PostgreSQLDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is DOWN"
          description: "PostgreSQL has been unreachable for more than 1 minute."

      # Database connection pool near limit
      - alert: DBConnectionsHigh
        expr: pg_stat_database_numbackends{datname="salespilot_db"} > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connections high (>80)"
          description: "{{ $value }} active database connections."

      # Long-running queries
      - alert: SlowQueries
        expr: pg_stat_activity_max_tx_duration{datname="salespilot_db"} > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow database queries detected"
          description: "Query running for {{ $value | humanizeDuration }}."

  - name: redis_alerts
    rules:
      # Redis down
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is DOWN"
          description: "Redis has been unreachable for more than 1 minute."

      # Redis memory near limit
      - alert: RedisHighMemory
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage >85%"
          description: "Redis is using {{ $value | humanizePercentage }} of its memory limit."

  - name: celery_alerts
    rules:
      # Celery queue growing
      - alert: CeleryQueueBacklog
        expr: flower_events_total{type="task-received"} - flower_events_total{type="task-succeeded"} > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Celery queue backlog >100 tasks"
          description: "Task backlog is {{ $value }} tasks."

      # Celery workers offline
      - alert: CeleryWorkersDown
        expr: flower_workers_online < 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "All Celery workers are offline"
          description: "No Celery workers are currently active."

  - name: system_alerts
    rules:
      # High disk usage
      - alert: HighDiskUsage
        expr: 100 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} * 100) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk usage >85%"
          description: "Root filesystem is {{ $value | humanize }}% full."

      # High CPU
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "CPU usage >90%"
          description: "CPU usage is {{ $value | humanize }}% for 10 minutes."

      # High memory
      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes > 0.90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Memory usage >90%"
          description: "Memory usage is {{ $value | humanizePercentage }}."
