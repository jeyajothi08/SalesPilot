-- ============================================================
-- SalesPilot AI — PostgreSQL Production Configuration
-- Tuned for 4GB RAM, 4 CPU production server
-- Apply with: ALTER SYSTEM SET <param> = '<value>';
-- ============================================================

-- ── Connection Settings ─────────────────────────────────────
max_connections = 200
superuser_reserved_connections = 3

-- ── Memory Settings ─────────────────────────────────────────
shared_buffers = 1GB                 # 25% of total RAM
effective_cache_size = 3GB           # 75% of total RAM
work_mem = 16MB                      # Per-sort per-connection
maintenance_work_mem = 256MB         # For VACUUM, CREATE INDEX

-- ── WAL / Write Performance ──────────────────────────────────
wal_level = replica
max_wal_size = 2GB
min_wal_size = 512MB
checkpoint_completion_target = 0.9
wal_buffers = 64MB

-- ── Query Planner ────────────────────────────────────────────
random_page_cost = 1.1               # SSD: set to 1.1
seq_page_cost = 1.0
effective_io_concurrency = 200       # SSD: set to 200
default_statistics_target = 100

-- ── Parallel Queries ─────────────────────────────────────────
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_worker_processes = 8

-- ── Logging ──────────────────────────────────────────────────
log_destination = 'stderr'
logging_collector = on
log_directory = 'pg_log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 1000    # Log queries > 1 second
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
log_line_prefix = '%m [%p] %q%u@%d '

-- ── Autovacuum ───────────────────────────────────────────────
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 60s
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_cost_delay = 2ms

-- ── Lock Management ──────────────────────────────────────────
deadlock_timeout = 1s
lock_timeout = 30s
statement_timeout = 60s             # Kill queries running > 60s

-- ── SSL ──────────────────────────────────────────────────────
ssl = on
ssl_min_protocol_version = 'TLSv1.2'
