# ============================================================
# SalesPilot AI — Production docker-compose
# Usage: docker compose -f docker-compose.production.yml up -d
# ============================================================

version: '3.9'

x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
  SECRET_KEY: ${SECRET_KEY}
  ENVIRONMENT: production
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  SENDGRID_API_KEY: ${SENDGRID_API_KEY}
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
  ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  AWS_S3_BUCKET: ${AWS_S3_BUCKET}
  AWS_REGION: ${AWS_REGION:-us-east-1}
  SENTRY_DSN: ${SENTRY_DSN:-}

x-deploy-resources: &api-resources
  resources:
    limits:
      cpus: '2'
      memory: 2G
    reservations:
      cpus: '0.5'
      memory: 512M

services:
  # ── PostgreSQL (Production) ──────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: sp_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/db/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - pgbackup:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend_network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  # ── Redis (Production, Persistent) ───────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sp_redis_prod
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend_network

  # ── Backend API (Production) ─────────────────────────────────
  api:
    image: ${DOCKER_REGISTRY}/salespilot-api:${IMAGE_TAG:-latest}
    container_name: sp_api_prod
    restart: always
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - backend_network
      - frontend_network
    deploy:
      <<: *api-resources
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      restart_policy:
        condition: on-failure
        max_attempts: 3

  # ── Database Migrator (runs once on deploy) ──────────────────
  migrator:
    image: ${DOCKER_REGISTRY}/salespilot-api:${IMAGE_TAG:-latest}
    container_name: sp_migrator_prod
    environment:
      <<: *backend-env
    command: python create_tables.py
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    networks:
      - backend_network

  # ── Celery Worker (Production, scalable) ─────────────────────
  worker:
    image: ${DOCKER_REGISTRY}/salespilot-worker:${IMAGE_TAG:-latest}
    restart: always
    environment:
      <<: *backend-env
    command: >
      celery -A app.worker worker
      --loglevel=info
      --concurrency=4
      --max-tasks-per-child=1000
      --prefetch-multiplier=1
    depends_on:
      - api
      - redis
    networks:
      - backend_network
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # ── Celery Beat (Single instance!) ───────────────────────────
  beat:
    image: ${DOCKER_REGISTRY}/salespilot-worker:${IMAGE_TAG:-latest}
    container_name: sp_beat_prod
    restart: always
    environment:
      <<: *backend-env
    command: celery -A app.worker beat --loglevel=info
    depends_on:
      - worker
    networks:
      - backend_network
    deploy:
      replicas: 1  # MUST be 1 - duplicate beat = duplicate tasks

  # ── Nginx Reverse Proxy ───────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: sp_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/docker/nginx-security.conf:/etc/nginx/snippets/security-headers.conf:ro
      - ./apps/web/dist:/usr/share/nginx/html:ro
      - certbot_certs:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - api
    networks:
      - frontend_network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Certbot (TLS Certificate Renewal) ────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: sp_certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  # ── Prometheus ────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: sp_prometheus
    restart: always
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/rules:/etc/prometheus/rules:ro
      - prometheusdata:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - monitoring_network
      - backend_network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # ── Grafana ───────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: sp_grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: monitoring.salespilot.ai
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: ${SMTP_HOST:-smtp.sendgrid.net:587}
      GF_SMTP_USER: ${SMTP_USER:-apikey}
      GF_SMTP_PASSWORD: ${SENDGRID_API_KEY}
    volumes:
      - grafanadata:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infrastructure/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3001:3000"
    networks:
      - monitoring_network

  # ── Backup Service ────────────────────────────────────────────
  backup:
    image: prodrigestivill/postgres-backup-local:latest
    container_name: sp_backup
    restart: always
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      SCHEDULE: "0 2 * * *"  # 2 AM daily
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    volumes:
      - pgbackup:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend_network

volumes:
  pgdata:
    name: sp_pgdata_prod
  redisdata:
    name: sp_redisdata_prod
  pgbackup:
    name: sp_pgbackup_prod
  certbot_certs:
    name: sp_certbot_certs
  certbot_www:
    name: sp_certbot_www
  nginx_logs:
    name: sp_nginx_logs
  prometheusdata:
    name: sp_prometheusdata
  grafanadata:
    name: sp_grafanadata

networks:
  backend_network:
    name: sp_backend_prod
    driver: bridge
    internal: true
  frontend_network:
    name: sp_frontend_prod
    driver: bridge
  monitoring_network:
    name: sp_monitoring_prod
    driver: bridge
